# English source templates for Odette's rule-flag summaries.
# Translated into a workspace's language on demand and cached via
# app.shared.localized_strings.get_localized_string(). {placeholder} tokens
# are Python str.format() fields — see app/agents/supervisor/rules.py and
# personas.py::odette_flag_summary() for the format_ctx built per flag_type.
tier_seat_exceeded: "Your workspace has {active_members} active members, but the {tier} plan includes {seats} seats. Add seats or remove {overage} member(s) to fix this."
daily_publish_cap: "You've published {count} times in the last 24 hours, and the {tier} plan allows {cap} a day. Spread out your scheduled posts or move to a bigger plan."
rbac_violation: "A member with the {actor_role} role tried to do '{event_type}', which that role isn't allowed to do. Check their role and how it happened."
brand_voice_instability: "The brand voice was changed {count} times in the last 24 hours. Frequent changes make everyone's posts sound different. Agree on the changes together, then lock the voice."
member_churn: "{summary}. Check that this was planned and that access was set up correctly."
assistant_signal_storm: "{summary}. This usually has one shared cause, such as a recent brand change, a faulty template or a repeating automation. Take a look."
connection_broken: "Ekavo can no longer access {platform} ({account}), and renewing it automatically failed {failures} times. Reconnect it in Settings, because scheduled posts to it will fail until then."
platform_capability_drift: "{platforms} {verb} still connected, but Ekavo no longer fully supports {pronoun}. Publishing and analytics there may stop working. Check the connection in Settings."
platform_delivery_failing: "Posts to {platform} failed {failures} times in the last {window_hours} hours. Check the connection in Settings before more scheduled posts go out."
member_churn_removed: "{count} members were removed from the workspace in the last {window_hours} hours. Check that this was planned and that their access was fully removed."
member_churn_elevated: "{count} members were given owner or admin access in the last {window_hours} hours. Check that this was planned."
assistant_signal_storm_member: "One team member received {count} assistant alerts in the last 24 hours. This usually has one shared cause, such as a recent brand change, a faulty template or a repeating automation. Take a look."
assistant_signal_storm_shared: "{member_count} team members received the same kind of assistant alert in the last {window_hours} hours. This usually has one shared cause, such as a recent brand change or a faulty template. Take a look."
__fallback__: "{flag_type_label}: {detail}"
# Wording for a workspace of one or two people (chosen by the workspace's plan; see personas.py).
brand_voice_instability_solo: "You changed your brand voice {count} times in the last 24 hours. That much change makes your posts sound different from each other. Settle your edits, then lock the voice."
brand_voice_instability_pair: "The brand voice was changed {count} times in the last 24 hours. Frequent changes make both of your posts drift apart. Agree on the edits together, then lock the voice."
daily_publish_cap_solo: "You've published {count} times in the last 24 hours, and your limit is {cap} a day. Spread out your scheduled posts or move to a bigger plan."
daily_publish_cap_pair: "The two of you have published {count} times in the last 24 hours, and your limit is {cap} a day. Spread out your scheduled posts or move to a bigger plan."
video_renders_failing: "{failures} video renders failed in the last {window_hours} hours. Open the video activity to see the reasons. If it keeps happening, the render host may need attention."
video_minutes_high: "You have used {used} of your {limit} video render minutes this month. New renders stop at the limit, and your minutes start again on the 1st."
video_storage_high: "Your videos take {used} MB of the {limit} MB your plan includes. Remove videos you no longer need before new ones are refused."
video_automation_stopped: "An automatic video recipe stopped because a check failed: {reason}. Nothing was published. Open it to decide what to do."
video_connection_expiring: "{platform} will need to be reconnected before {count} scheduled video {noun} goes out. Reconnect it in Settings so the video is not missed."
video_voice_changed: "Your brand voice changed after the videos for your scheduled posts were made. Posts affected: {count}. The captions may not match the new voice, so check them before they go out."
video_auto_publish_on: "{count} video {noun} can publish without anyone approving each post. Each post is scheduled 15 minutes ahead and can be pulled from Needs your decision. Check that this is still what you want."
