# English source templates for Remy's personal-assistant signal messages.
# Translated into a member's language on demand and cached via
# app.shared.localized_strings.get_localized_string() — see signals.py::remy_message().
voice_drift: "This post sounds a bit different from how you usually write{why_suffix}. Want me to bring it back closer to your normal voice, or is the change on purpose?"
voice_drift_trend: "Your last few posts have slowly moved away from your usual voice. No single post is a problem, but the pattern is there. It's worth a look before it sticks."
volume_spike: "You've posted a lot more than usual today: {today}, compared with about {mean} a day. That's fine if it's on purpose. If not, check that nothing is posting on repeat."
volume_drop: "You haven't posted for the last few days after a steady run. No pressure. I'm here whenever you want to pick it back up."
platform_volume_drop: "You haven't posted on {platform} for {zero_days} days, though you've kept posting elsewhere. It used to get about {baseline_per_day} a day. Post there again if it's still part of your plan, or ignore this if the pause is on purpose."
topic_shift: "Your recent posts are about different topics than before. If you're changing direction on purpose, you can ignore this. If not, you may be drifting away from what your audience expects."
quality_regression: "More of your recent drafts than usual were flagged for review. It may help to slow down a little on your next few posts."
__fallback__: "Something in your recent content is worth a look."
